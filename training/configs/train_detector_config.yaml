# Training Hyperparameters for Stage 1 Plant & Organ Detector
# Enforces Asymmetric Focal Loss for Hard-Negative False-Positive Elimination

model:
  architecture: "yolo11n" # YOLOv11-Nano backbone
  pretrained_weights: "yolo11n.pt"
  input_resolution: 384
  channels: 3

training:
  epochs: 150
  batch_size: 32
  optimizer: "AdamW"
  lr0: 0.002
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 5.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1

# Asymmetric Loss Parameters to Suppress Background False Positives
loss:
  box_weight: 7.5
  cls_weight: 0.5
  dfl_weight: 1.5
  asymmetric_focal_gamma_pos: 1.5
  asymmetric_focal_gamma_neg: 4.0 # Aggressive suppression for false positives
  alpha_balance: 0.65

# Data Augmentation Strategy for Color-Invariance
augmentation:
  hsv_h: 0.40 # Extreme hue jittering (breaks "green = plant" shortcut)
  hsv_s: 0.70 # Heavy desaturation
  hsv_v: 0.40 # Variable sunlight and shadow
  degrees: 25.0
  translate: 0.15
  scale: 0.50
  shear: 5.0
  perspective: 0.0005
  flipud: 0.5
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.20
  copy_paste: 0.30 # Pastes hard negatives (hands/soil/tools) into target images
